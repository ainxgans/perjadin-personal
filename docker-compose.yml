services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: perjadin
      POSTGRES_PASSWORD: perjadin
      POSTGRES_DB: perjadin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  pgdata:
