services:
  app:
    container_name: perjadin-personal-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8010}:8080"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - reusable-network

networks:
  reusable-network:
    external: true
